<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title th:text="${titulo}"></title>
</head>
<body>
	<h1 th:text="${titular}"></h1>
	<p>Elige una lotería y te damos una combinación al azar.</p>
	
	<ul>
		<li th:each="loto: ${loterias}">
			<a th:href="@{/loto/genera/{max}/{cantidad}/{pais}(max=${loto.max}, cantidad=${loto.cantidad},
				pais=${loto.pais})}" th:text=${loto.pais}>País</a>
			<span th:text="|${loto.cantidad} números del 1 al ${loto.max}|">6 de 49</span>
		</li>
	</ul>
	<a th:href="@{/home}">Volver al inicio</a>
</body>
</html>
